<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas PDF Tabs</title>
  <link rel="stylesheet" href="../../vendor/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header><strong id="filename">Canvas PDF Tabs</strong>
    <fieldset id="readingControls" disabled>
      <button id="previousPage" aria-label="Previous page">‹</button><input id="pageNumber" aria-label="Page number" inputmode="numeric" value="1"><span id="pageCount">/ —</span><button id="nextPage" aria-label="Next page">›</button>
      <span class="divider"></span><button id="zoomOut" aria-label="Zoom out">−</button><output id="zoomPercent">100%</output><button id="zoomIn" aria-label="Zoom in">+</button>
      <select id="fitMode" aria-label="Page fitting"><option value="custom">Custom zoom</option><option value="page-width">Fit width</option><option value="page-fit">Fit page</option><option value="100">100%</option></select>
      <button id="findButton" title="Find text (Ctrl+F)">Find</button>
    </fieldset>
    <button id="download" disabled title="Download the original PDF">Download</button>
    <select id="theme" aria-label="Viewer theme"><option value="system">System theme</option><option value="light">Light</option><option value="dark">Dark</option></select>
  </header>
  <section id="findBar" hidden aria-label="Find in document"><input id="findInput" type="search" placeholder="Find in document" aria-label="Search PDF text"><output id="findCount" role="status"></output><button id="findPrevious" aria-label="Previous match">↑</button><button id="findNext" aria-label="Next match">↓</button><button id="closeFind" aria-label="Close search">×</button></section>
  <section id="status" role="status">Opening your Canvas PDF…</section>
  <section id="error" hidden role="alert"><h1>Unable to open this PDF</h1><p id="errorText"></p><button id="retry">Retry</button> <button id="back">Back to Canvas</button></section>
  <div id="viewerContainer" role="main" tabindex="0" aria-label="PDF document"><div id="viewer" class="pdfViewer"></div></div>
  <fieldset id="layoutControls" disabled aria-label="Page layout"><button id="onePage" aria-pressed="true">One page</button><button id="twoPages" aria-pressed="false">Two pages</button></fieldset>
  <script type="module" src="bootstrap.js"></script>
</body>
</html>
